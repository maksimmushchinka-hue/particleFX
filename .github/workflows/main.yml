name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project root
        id: root
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -1)
          if [ -z "$POM" ]; then
            echo "pom.xml не найден в репозитории"
            exit 1
          fi
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"
          echo "Проект найден в: $POM"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: mvn -B clean package
        working-directory: ${{ steps.root.outputs.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: ParticleFX
          path: ${{ steps.root.outputs.dir }}/target/*.jar
