# ParticleFX — конфигурация
# Все эффекты можно выключать по одному; лимиты защищают сервер от перегрузки.

limits:
  max-scale: 5.0                  # предельный масштаб (GUI и команда клампят к нему)
  max-duration: 400               # предельная длительность в тиках
  max-speed: 3.0                  # предельная скорость
  max-particles-per-tick: 4000    # общий бюджет частиц на тик для всех эффектов
  max-active-per-player: 2        # одновременно работающих эффектов у игрока
  max-active-server: 40           # максимум эффектов на сервере

preview:
  enabled: true                   # кнопка предпросмотра в меню настроек

defaults:
  scale: 1.0
  duration: 160
  speed: 1.0
  density: 1.0
  ahead: false                    # false = на месте игрока, true = перед игроком

